name: Render Zodiac Images

on:
  workflow_dispatch:
    inputs:
      zodiac_text:
        description: 'Zodiac text to render'
        required: true
      run_token:
        description: 'Unique run token — used as release tag'
        required: true
      user_id:
        description: 'User ID for session tracking'
        required: false
        default: ''
      job_id:
        description: 'Job ID for session tracking'
        required: false
        default: ''
      output_mode:
        description: 'Output mode: image or video'
        required: false
        default: 'image'

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            fonts-noto-color-emoji ffmpeg

      - name: Render images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZODIAC_TEXT: ${{ github.event.inputs.zodiac_text }}
          RUN_TOKEN: ${{ github.event.inputs.run_token }}
        run: node render.js

      - name: Convert images to 10-second videos (video mode)
        if: ${{ github.event.inputs.output_mode == 'video' }}
        run: |
          mkdir -p output_video
          for f in output/*.png; do
            base=$(basename "$f" .png)
            ffmpeg -y \
              -loop 1 -i "$f" \
              -c:v libx264 -preset fast -crf 18 \
              -t 10 \
              -vf "scale=1080:1920:flags=lanczos,format=yuv420p" \
              -movflags +faststart \
              "output_video/${base}.mp4"
            echo "✅ Video: ${base}.mp4"
          done
          echo "🎬 All videos created: $(ls output_video/*.mp4 | wc -l)"

      - name: Upload IMAGES to GitHub Release
        id: upload_release
        if: ${{ github.event.inputs.output_mode != 'video' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_TOKEN: ${{ github.event.inputs.run_token }}
          REPO: ${{ github.repository }}
        run: |
          PNG_COUNT=$(ls output/*.png 2>/dev/null | wc -l)
          if [ "$PNG_COUNT" -eq 0 ]; then
            echo "FILE_COUNT=0" >> $GITHUB_OUTPUT
            echo "No PNG files found" && exit 1
          fi
          echo "FILE_COUNT=$PNG_COUNT" >> $GITHUB_OUTPUT
          echo "FILE_TYPE=image" >> $GITHUB_OUTPUT

          gh release create "$RUN_TOKEN" output/*.png \
            --title "VDO Run $RUN_TOKEN" \
            --notes "Auto-generated — $PNG_COUNT images" \
            --repo "$REPO"

          BASE_URL="https://github.com/${REPO}/releases/download/${RUN_TOKEN}"
          FILE_URLS=$(ls output/*.png | sort | BASE_URL="$BASE_URL" python3 -c "
          import sys,json,os
          base=os.environ['BASE_URL']
          files=[os.path.basename(l.strip()) for l in sys.stdin if l.strip()]
          print(json.dumps([f'{base}/{f}' for f in sorted(files) if f.endswith('.png')]))
          ")
          echo "FILE_URLS=$FILE_URLS" >> $GITHUB_OUTPUT
          echo "URLs: $FILE_URLS"

      - name: Upload VIDEOS to GitHub Release
        id: upload_release_video
        if: ${{ github.event.inputs.output_mode == 'video' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_TOKEN: ${{ github.event.inputs.run_token }}
          REPO: ${{ github.repository }}
        run: |
          MP4_COUNT=$(ls output_video/*.mp4 2>/dev/null | wc -l)
          if [ "$MP4_COUNT" -eq 0 ]; then
            echo "FILE_COUNT=0" >> $GITHUB_OUTPUT
            echo "No MP4 files found" && exit 1
          fi
          echo "FILE_COUNT=$MP4_COUNT" >> $GITHUB_OUTPUT
          echo "FILE_TYPE=video" >> $GITHUB_OUTPUT

          gh release create "$RUN_TOKEN" output_video/*.mp4 \
            --title "VDO Run $RUN_TOKEN" \
            --notes "Auto-generated — $MP4_COUNT videos" \
            --repo "$REPO"

          BASE_URL="https://github.com/${REPO}/releases/download/${RUN_TOKEN}"
          FILE_URLS=$(ls output_video/*.mp4 | sort | BASE_URL="$BASE_URL" python3 -c "
          import sys,json,os
          base=os.environ['BASE_URL']
          files=[os.path.basename(l.strip()) for l in sys.stdin if l.strip()]
          print(json.dumps([f'{base}/{f}' for f in sorted(files) if f.endswith('.mp4')]))
          ")
          echo "FILE_URLS=$FILE_URLS" >> $GITHUB_OUTPUT
          echo "URLs: $FILE_URLS"

      - name: Save session metadata via worker
        env:
          RUN_TOKEN: ${{ github.event.inputs.run_token }}
          USER_ID: ${{ github.event.inputs.user_id }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          ZODIAC_TEXT: ${{ github.event.inputs.zodiac_text }}
          OUTPUT_MODE: ${{ github.event.inputs.output_mode }}
          FILE_URLS: ${{ github.event.inputs.output_mode == 'video' && steps.upload_release_video.outputs.FILE_URLS || steps.upload_release.outputs.FILE_URLS }}
          FILE_COUNT: ${{ github.event.inputs.output_mode == 'video' && steps.upload_release_video.outputs.FILE_COUNT || steps.upload_release.outputs.FILE_COUNT }}
          WORKER_URL: 'https://vdo.shreevathsa2k21-4fa.workers.dev'
        run: |
          if [ -z "$USER_ID" ] || [ -z "$JOB_ID" ]; then
            echo "No userId/jobId — skipping session save"
            exit 0
          fi
          if [ "$FILE_COUNT" = "0" ] || [ -z "$FILE_URLS" ]; then
            echo "No files to save"
            exit 0
          fi

          PROMPT_JSON=$(echo "$ZODIAC_TEXT" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().rstrip('\n')))")

          HTTP_STATUS=$(curl -s -o /tmp/save_resp.json -w "%{http_code}" \
            -X POST "${WORKER_URL}/save-session" \
            -H "Content-Type: application/json" \
            -d "{
              \"userId\": \"${USER_ID}\",
              \"jobId\": \"${JOB_ID}\",
              \"runToken\": \"${RUN_TOKEN}\",
              \"prompt\": ${PROMPT_JSON},
              \"imageUrls\": ${FILE_URLS},
              \"outputMode\": \"${OUTPUT_MODE}\",
              \"status\": \"done\"
            }")

          echo "Worker response ($HTTP_STATUS): $(cat /tmp/save_resp.json)"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Warning: session save returned $HTTP_STATUS"
          fi

      - name: Upload artifact fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-output-${{ github.event.inputs.run_token }}
          path: |
            output/*.png
            output_video/*.mp4
          retention-days: 1
