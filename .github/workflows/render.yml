name: Render Zodiac Images

on:
  workflow_dispatch:
    inputs:
      zodiac_text:
        description: 'Zodiac text to render'
        required: true
      run_token:
        description: 'Unique run token — used as release tag'
        required: true
      user_id:
        description: 'User ID for session tracking'
        required: false
        default: ''
      job_id:
        description: 'Job ID for session tracking'
        required: false
        default: ''

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create GitHub Releases

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Install Chrome system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64 \
            fonts-noto-color-emoji

      - name: Render images
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ZODIAC_TEXT: ${{ github.event.inputs.zodiac_text }}
          RUN_TOKEN: ${{ github.event.inputs.run_token }}
        run: node render.js

      # ── PERMANENT STORAGE via GitHub Releases ───────────────────────────────
      # Images are uploaded as release assets — they do NOT bloat the repo.
      # Release asset URLs are permanent and publicly accessible:
      #   https://github.com/{owner}/{repo}/releases/download/{tag}/{filename}
      # This approach supports unlimited images forever at zero cost.
      # ─────────────────────────────────────────────────────────────────────────
      - name: Upload images to GitHub Release
        id: upload_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_TOKEN: ${{ github.event.inputs.run_token }}
        run: |
          # Verify PNGs exist
          PNG_COUNT=$(ls output/*.png 2>/dev/null | wc -l)
          if [ "$PNG_COUNT" -eq 0 ]; then
            echo "❌ No PNG files found in output/"
            echo "PNG_COUNT=0" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "PNG_COUNT=$PNG_COUNT" >> $GITHUB_OUTPUT
          echo "✅ Found $PNG_COUNT PNG files"

          # Create a GitHub Release and upload all PNGs as assets
          # Tag = run_token (unique per job, safe for git tags)
          gh release create "$RUN_TOKEN" \
            output/*.png \
            --title "VDO Run $RUN_TOKEN" \
            --notes "Auto-generated zodiac images — $PNG_COUNT files" \
            --repo "${{ github.repository }}"

          echo "✅ Release created: $RUN_TOKEN"

          # Build JSON array of permanent download URLs
          # Format: https://github.com/{owner}/{repo}/releases/download/{tag}/{filename}
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/${RUN_TOKEN}"

          IMAGE_URLS=$(ls output/*.png | sort | python3 -c "
import sys, json, os
base = os.environ['BASE_URL']
files = [os.path.basename(line.strip()) for line in sys.stdin if line.strip()]
urls = [f'{base}/{f}' for f in sorted(files) if f.endswith('.png')]
print(json.dumps(urls))
" BASE_URL="$BASE_URL")

          echo "IMAGE_URLS=$IMAGE_URLS" >> $GITHUB_OUTPUT
          echo "✅ Image URLs: $IMAGE_URLS"

      # ── NOTIFY WORKER — save session metadata ────────────────────────────────
      - name: Save session metadata via worker
        if: steps.upload_release.outputs.PNG_COUNT != '0'
        env:
          RUN_TOKEN: ${{ github.event.inputs.run_token }}
          USER_ID: ${{ github.event.inputs.user_id }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          ZODIAC_TEXT: ${{ github.event.inputs.zodiac_text }}
          IMAGE_URLS: ${{ steps.upload_release.outputs.IMAGE_URLS }}
          WORKER_URL: 'https://vdo.shreevathsa2k21-4fa.workers.dev'
        run: |
          if [ -z "$USER_ID" ] || [ -z "$JOB_ID" ]; then
            echo "No userId/jobId provided — skipping session save"
            exit 0
          fi

          PROMPT_JSON=$(echo "$ZODIAC_TEXT" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().rstrip('\n')))")

          HTTP_STATUS=$(curl -s -o /tmp/save_resp.json -w "%{http_code}" \
            -X POST "${WORKER_URL}/save-session" \
            -H "Content-Type: application/json" \
            -d "{
              \"userId\": \"${USER_ID}\",
              \"jobId\": \"${JOB_ID}\",
              \"runToken\": \"${RUN_TOKEN}\",
              \"prompt\": ${PROMPT_JSON},
              \"imageUrls\": ${IMAGE_URLS},
              \"status\": \"done\"
            }")

          echo "Worker response ($HTTP_STATUS): $(cat /tmp/save_resp.json)"
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "⚠️ Warning: session save returned $HTTP_STATUS — images are still in GitHub Release"
          else
            echo "✅ Session saved successfully"
          fi

      # Keep artifact as short-term fallback (available immediately via API)
      - name: Upload artifact (short-term fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zodiac-images-${{ github.event.inputs.run_token }}
          path: output/*.png
          retention-days: 1
